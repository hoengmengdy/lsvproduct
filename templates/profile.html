{% extends 'base.html' %}{% block title %}Profile — LSV{% endblock %}{% block content %}<div class="container py-5 narrow"><span class="eyebrow">YOUR ACCOUNT</span><h1>Profile</h1><div class="panel mt-4"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{ current_user.name }}" required><label class="form-label">Email</label><input class="form-control mb-3" value="{{ current_user.email }}" disabled><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{ current_user.phone or '' }}"><label class="form-label">Default address</label><textarea class="form-control mb-3" name="address" rows="3">{{ current_user.address or '' }}</textarea><button class="btn btn-dark">Save changes</button></form></div></div>{% endblock %}
