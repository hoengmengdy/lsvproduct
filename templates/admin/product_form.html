{% extends 'admin/base.html' %}{% block content %}<h1>{{ 'Edit' if product.id else 'Add' }} product</h1><form method="post" enctype="multipart/form-data" class="panel mt-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-8"><label class="form-label">{{ t('name', 'Name') }}</label><input class="form-control" name="name" value="{{ product.name or '' }}" required></div><div class="col-md-4"><label class="form-label">{{ t('category', 'Category') }}</label><select class="form-select" name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if product.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="5" required>{{ product.description or '' }}</textarea></div><div class="col-md-4"><label class="form-label">{{ t('price', 'Price') }}</label><input class="form-control" type="number" step="0.01" min="0" name="price" value="{{ product.price or '' }}" required></div><div class="col-md-4"><label class="form-label">Old price</label><input class="form-control" type="number" step="0.01" min="0" name="old_price" value="{{ product.old_price or '' }}"></div><div class="col-md-4"><label class="form-label">{{ t('stock', 'Stock') }}</label><input class="form-control" type="number" min="0" name="stock" value="{{ product.stock or 0 }}" required></div><div class="col-md-8"><label class="form-label">Image (PNG, JPG, WEBP, GIF; max 5 MB)</label><input class="form-control" type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif"></div><div class="col-md-4 d-flex align-items-end"><label class="form-check mb-2"><input class="form-check-input" type="checkbox" name="status" {% if product.status or not product.id %}checked{% endif %}> Active</label></div></div><button class="btn btn-dark mt-4">Save product</button> <a class="btn btn-light mt-4" href="{{ url_for('admin.products') }}">Cancel</a></form>{% endblock %}
