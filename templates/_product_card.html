<div class="col-sm-6 col-lg-3">
 <article class="product-card h-100"><a class="product-image" href="{{ url_for('shop.product_detail', product_id=product.id) }}">{% if product.image %}<img src="{{ url_for('static', filename='uploads/'+product.image) }}" alt="{{ product.name }}">{% else %}<div class="image-placeholder"><i class="bi bi-box-seam"></i></div>{% endif %}{% if product.old_price %}<span class="sale-badge">Sale</span>{% endif %}</a>
 <div class="p-3"><small class="product-brand text-uppercase">{{ product.category.name }}</small><h3 class="h6 mt-2"><a href="{{ url_for('shop.product_detail', product_id=product.id) }}">{{ product.name }}</a></h3><div class="d-flex align-items-center justify-content-between mt-3"><div><strong class="product-price">${{ '%.2f'|format(product.price) }}</strong>{% if product.old_price %}<del class="small ms-1">${{ '%.2f'|format(product.old_price) }}</del>{% endif %}</div><form method="post" action="{{ url_for('cart.add', product_id=product.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="icon-btn" title="{{ t('add_cart', 'Add to cart') }}" aria-label="{{ t('add_cart', 'Add to cart') }}" {% if product.stock<1 %}disabled{% endif %}><i class="bi bi-bag-plus"></i></button></form></div></div></article>
</div>
